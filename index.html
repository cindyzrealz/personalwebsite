<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Cindy Zeng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="index.html">Cindy Zeng</a>
    <nav class="site-nav">
      <a href="writing/">Writing</a>
      <a href="carving/">Carving</a>
    </nav>
  </header>

  <main class="room">

    <svg class="room-scene" viewBox="0 0 1800 620" role="img" aria-label="Writing, Carving, and About icons.">

      <!-- 1 · Writing icon → Writing -->
      <a class="room-object" href="writing/" aria-label="Writing">
        <title>Writing</title>
        <g class="obj">
          <image href="assets/images/writing-icon.png" x="100" y="70" width="500" height="500" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="275" y="20" width="150" height="34" rx="17"/>
          <text x="350" y="42" text-anchor="middle">Writing</text>
        </g>
      </a>

      <!-- 2 · Carving icon → Carving -->
      <a class="room-object" href="carving/" aria-label="Carving">
        <title>Carving</title>
        <g class="obj">
          <image href="assets/images/carving-icon.png" x="700" y="70" width="500" height="500" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="875" y="20" width="150" height="34" rx="17"/>
          <text x="950" y="42" text-anchor="middle">Carving</text>
        </g>
      </a>

      <!-- 3 · Mirror on the wall → About -->
      <a class="room-object" href="about/" aria-label="About">
        <title>About</title>
        <g class="obj">
          <ellipse cx="1500" cy="320" rx="200" ry="250" fill="var(--room-wood)"/>
          <ellipse cx="1500" cy="320" rx="176" ry="225" fill="var(--room-glass)"/>
          <ellipse class="mirror-glint" cx="1465" cy="270" rx="36" ry="64" fill="#ffffff" transform="rotate(-20 1465 270)"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="1425" y="20" width="150" height="34" rx="17"/>
          <text x="1500" y="42" text-anchor="middle">About</text>
        </g>
      </a>

    </svg>

  </main>

  <footer class="site-footer">
    <p class="footer-bio">Writer, carver, storyteller.</p>
    <p class="footer-links">
      <a href="mailto:contact@cindyzen g.com">Email</a>
      <a href="about/">About</a>
    </p>
    <a class="back-to-top" href="#">↑ Back to top</a>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
