<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Cindy Zeng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="index.html">Cindy Zeng</a>
    <nav class="site-nav">
      <a href="writing/">Writing</a>
      <a href="carving/">Carving</a>
    </nav>
  </header>

  <main class="room">

    <section class="room-heading">
      <h1>Welcome to my room.</h1>
      <p>Click around — each object leads somewhere.</p>
    </section>

    <svg class="room-scene" viewBox="0 0 1200 760" role="img" aria-label="A stylized room; click the bookshelf, scroll, or mirror to navigate.">

      <!-- Wall & floor -->
      <rect x="0" y="0" width="1200" height="520" fill="var(--room-wall)"/>
      <rect x="0" y="520" width="1200" height="240" fill="var(--room-floor)"/>
      <rect x="0" y="516" width="1200" height="8" fill="var(--room-line)"/>

      <!-- Floor planks -->
      <line x1="0" y1="580" x2="1200" y2="580" stroke="var(--room-line)" stroke-width="2"/>
      <line x1="0" y1="650" x2="1200" y2="650" stroke="var(--room-line)" stroke-width="2"/>
      <line x1="0" y1="720" x2="1200" y2="720" stroke="var(--room-line)" stroke-width="2"/>

      <!-- Rug -->
      <ellipse cx="600" cy="650" rx="320" ry="60" fill="var(--room-rug)"/>

      <!-- Ambient dust motes -->
      <circle class="mote" cx="260" cy="430" r="3" fill="var(--color-muted)"/>
      <circle class="mote m2" cx="620" cy="330" r="2.5" fill="var(--color-muted)"/>
      <circle class="mote m3" cx="900" cy="470" r="3" fill="var(--color-muted)"/>

      <!-- 1 · Writing icon → Writing -->
      <a class="room-object" href="writing/" aria-label="Writing">
        <title>Writing</title>
        <g class="obj">
          <image href="assets/images/writing-icon.png" x="60" y="160" width="240" height="240" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="105" y="66" width="150" height="34" rx="17"/>
          <text x="180" y="88" text-anchor="middle">Writing</text>
        </g>
      </a>

      <!-- 2 · Scroll on the wall → Carving -->
      <a class="room-object" href="carving/" aria-label="Carving">
        <title>Carving</title>
        <g class="obj">
          <circle cx="550" cy="150" r="4" fill="var(--color-text)"/>
          <line x1="550" y1="154" x2="550" y2="168" stroke="var(--color-muted)" stroke-width="2"/>
          <rect x="492" y="168" width="116" height="12" rx="6" fill="var(--room-wood)"/>
          <rect x="506" y="180" width="88" height="300" fill="var(--room-paper)"/>
          <rect x="520" y="205" width="60" height="5" fill="var(--color-text)"/>
          <rect x="524" y="216" width="52" height="5" fill="var(--color-text)"/>
          <rect x="520" y="250" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="264" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="278" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="292" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="306" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="320" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="334" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="348" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="362" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="376" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="390" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="520" y="404" width="60" height="3" fill="var(--color-rule)"/>
          <rect x="538" y="420" width="24" height="24" rx="2" fill="var(--room-seal)"/>
          <rect x="492" y="480" width="116" height="12" rx="6" fill="var(--room-wood)"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="475" y="96" width="150" height="34" rx="17"/>
          <text x="550" y="118" text-anchor="middle">Carving</text>
        </g>
      </a>

      <!-- 3 · Mirror on the wall → About -->
      <a class="room-object" href="about/" aria-label="About">
        <title>About</title>
        <g class="obj">
          <ellipse cx="1030" cy="260" rx="100" ry="125" fill="var(--room-wood)"/>
          <ellipse cx="1030" cy="260" rx="88" ry="113" fill="var(--room-glass)"/>
          <ellipse class="mirror-glint" cx="1005" cy="230" rx="24" ry="44" fill="#ffffff" transform="rotate(-20 1005 230)"/>
        </g>
        <g class="room-label">
          <rect class="lbl-pill" x="955" y="86" width="150" height="34" rx="17"/>
          <text x="1030" y="108" text-anchor="middle">About</text>
        </g>
      </a>

    </svg>

  </main>

  <footer class="site-footer">
    <p class="footer-bio">Writer, carver, storyteller.</p>
    <p class="footer-links">
      <a href="mailto:contact@cindyzen g.com">Email</a>
      <a href="about/">About</a>
    </p>
    <a class="back-to-top" href="#">↑ Back to top</a>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
